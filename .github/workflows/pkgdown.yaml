# Build the pkgdown site and publish it with GitHub Pages
# (Settings → Pages → Source: GitHub Actions)
name: pkgdown

# Publishing a release runs the workflow against the tag, and the github-pages
# environment only accepts deployments from the default branch, so a release
# build always succeeded and then failed at the deploy step. Pushing to main
# already republishes the site, so the release trigger added nothing but a red
# cross. To publish from tags instead, allow them under
# Settings -> Environments -> github-pages -> deployment branches and tags.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned rather than ubuntu-latest: that label moves to Ubuntu 26 on
    # 19 October 2026, and the runner image should change when we choose it.
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
