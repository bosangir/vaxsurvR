url: https://neu-data.github.io/vaxsurvR/

template:
  bootstrap: 5
  bslib:
    primary: "#055F56"
    secondary: "#0B376C"
    navbar-bg: "#04242F"
    link-color: "#0B376C"
    headings-color: "#04242F"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

navbar:
  bg: primary
  type: dark
  structure:
    left: [intro, reference, articles, news]
    right: [search, neudata, github]
  components:
    neudata:
      icon: fa-globe
      href: https://www.neu-data.com
      aria-label: Neudata website

footer:
  structure:
    left: neudata
    right: built_with
  components:
    neudata: "Developed by [**Neudata Consulting Ltd**](https://www.neu-data.com) · *Insight. Impact. Innovation.*"

home:
  sidebar:
    structure: [links, license, community, citation, authors, dev]

articles:
  - title: Workflow
    navbar: ~
    contents:
      - preparing-a-survey
      - data-quality
      - deidentification
      - survey-analysis
      - coverage-indicators
      - end-to-end

reference:
  - title: The pipeline
    desc: >
      The workflow as a table; plot_vcs_pipeline() draws it and is listed under
      Figures and maps. The rendered guide is at
      inst/pipeline/vaxsurvR-pipeline.pdf.
    contents:
      - vcs_pipeline

  - title: Describe the survey
    desc: Schedules, dictionaries, recall maps and strata — set up once per survey.
    contents:
      - vcs_schedule
      - vcs_schedule_who
      - schedule_final_doses
      - vcs_dictionary
      - read_vcs_dictionary
      - vcs_recall_map
      - apply_recall_map
      - recall_dictionary_entries
      - vcs_concepts
      - resolve_concept
      - vcs_strata
      - vcs_vaccinations

  - title: Import and standardise
    contents:
      - read_vcs
      - read_surveycto
      - detect_delim
      - map_vcs_variables
      - attach_child_variables
      - vcs_children
      - vcs_recode
      - parse_vaccine_date
      - validate_partial_date
      - new_vcs_data

  - title: Data quality
    desc: Structural and vaccination-specific checks returning machine-readable issues.
    contents:
      - validate_vcs
      - starts_with("check_")
      - flag_vaccine_inconsistencies
      - vcs_rule
      - vcs_ruleset
      - vcs_default_rules
      - vcs_issue
      - issues
      - has_issues
      - vcs_severities
      - new_vcs_validation
      - c.vcs_validation
      - summary.vcs_validation
      - plot.vcs_validation
      - vcs_quality_report
      - vcs_missingness
      - card_completeness
      - coverage_completeness
      - date_completeness
      - date_quality_summary
      - sample_achieved
      - sample_size_parameters

  - title: Cleaning and audit trail
    contents:
      - clean_vcs
      - erase_illogical_dates
      - audit_changes
      - vcs_log
      - export_cleaning_log
      - mark_derived

  - title: Derived variables
    contents:
      - starts_with("derive_")
      - derivation_rules
      - classify_vaccination_timeliness
      - table_dose_intervals
      - vcs_evidence_definitions
      - vcs_evidence_levels
      - vcs_timing_levels
      - vcs_timing_rules
      - vcs_besd_map

  - title: De-identification
    contents:
      - deidentify_vcs
      - identify_pii
      - remove_direct_identifiers
      - hash_identifier
      - generalize_age
      - generalize_geography
      - shift_dates
      - assess_reidentification_risk

  - title: Survey design and weights
    contents:
      - vcs_design
      - as_survey_design
      - compute_survey_weights
      - trim_weights
      - validate_weights
      - design_effect
      - read_psu_frame
      - dissolve_frame_boundaries

  - title: Estimation
    contents:
      - starts_with("estimate_")
      - vcs_summary
      - compute_ccc
      - compute_cic
      - mosv_time_to_correction
      - besd_by_stratum
      - reasons_by_stratum
      - tabulate_categorical
      - tabulate_multiselect
      - as.data.frame.vcs_vctc

  - title: Figures and maps
    contents:
      - starts_with("plot_")
      - read_admin_boundaries
      - admin_map_data
      - psu_map_data
      - psu_map_summary
      - bar_measure
      - bar_table_size
      - save_vcs_plot

  - title: Tables and reports
    contents:
      - starts_with("ft_")
      - vcs_coverage_report
      - write_vcs_report
      - render_coverage_report
      - use_coverage_report
      - coverage_report_template
      - update_docx_fields

  - title: Look and feel
    contents:
      - vcs_palette
      - theme_vcs
      - vcs_font

  - title: Kongo Central (KC9) configuration
    desc: Ready-made configuration for the Kongo Central coverage survey.
    contents:
      - starts_with("kc9_")

  - title: Classes and helpers
    contents:
      - starts_with("is_vcs_")
      - summary.vcs_data
      - as.data.frame.vcs_dictionary

  - title: Example data
    desc: Fully synthetic data generated by `data-raw/make_vcs_example.R`.
    contents:
      - starts_with("vcs_example")
